[package]
name = "crab-antiagiota-performance"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crab-antiagiota-performance"
path = "src/main.rs"

[[bin]]
name = "build-index"
path = "src/bin/build-index.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
