[package]
name = "crab-antiagiota-p99"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
